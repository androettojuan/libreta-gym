<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9f1c22">
<meta name="description" content="Tu plan del gimnasio por día y el registro de tus pesos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Libreta de Gym</title>
<script>try { var t = localStorage.getItem("gym.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; sticky day switcher; each exercise is a row that opens into a logging panel. */
:root {
  --bg: #f4f0ef;
  --surface: #ffffff;
  --surface-2: #faf6f5;
  --ink: #1e1617;
  --muted: #6e6062;
  --line: #e3d9d8;
  --accent: #9f1c22;
  --accent-ink: #ffffff;
  --accent-soft: #f5e2e1;
  --ok: #2b7a4b;
  --ok-soft: #e1f1e7;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141011; --surface: #1e1819; --surface-2: #251e1f; --ink: #f2eaea; --muted: #a8999b;
    --line: #362c2d; --accent: #f0585e; --accent-ink: #1c0d0e; --accent-soft: #3a1d1f;
    --ok: #62c58d; --ok-soft: #1b3326; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141011; --surface: #1e1819; --surface-2: #251e1f; --ink: #f2eaea; --muted: #a8999b;
  --line: #362c2d; --accent: #f0585e; --accent-ink: #1c0d0e; --accent-soft: #3a1d1f;
  --ok: #62c58d; --ok-soft: #1b3326; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.05; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { padding-block: 20px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 2rem; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.today { font-family: var(--font-display); font-size: .95rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: right; }
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.theme-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); padding: 0; }
.theme-btn svg { width: 20px; height: 20px; }

.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 6px; }
.days button { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 6px 7px; text-align: center; }
.days b { display: block; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.days small { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.days button[aria-pressed="true"] small { color: inherit; opacity: .85; }

.notes { margin-block: 8px 4px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.notes summary { padding: 10px 14px; font-weight: 600; cursor: pointer; font-size: .92rem; }
.notes ul { margin: 0; padding: 0 14px 12px 32px; color: var(--muted); font-size: .92rem; }
.notes li + li { margin-top: 4px; }

/* Exercise list */
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ex-head { width: 100%; display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; background: none; border: 0; text-align: left; }
.ex-idx { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--muted); }
.ex.done .ex-idx { color: var(--ok); }
.ex-name { display: block; font-weight: 600; line-height: 1.25; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: .82rem; color: var(--muted); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.chip.sr-chip { font-family: var(--font-display); font-weight: 600; font-size: .95rem; color: var(--ink); letter-spacing: .02em; }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
.ex-last { text-align: right; line-height: 1; }
.ex-last b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }
.ex-last span { font-family: var(--font-display); font-size: .95rem; color: var(--muted); margin-left: 2px; }
.ex-last small { display: block; font-size: .72rem; color: var(--muted); margin-top: 3px; }
.ex-last.none { font-size: .8rem; color: var(--muted); }

.panel { border-top: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--surface-2); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .92rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; }
.btn.danger { color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.obs { margin: 0; font-size: .9rem; color: var(--muted); }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.field input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.stepper { display: grid; grid-template-columns: 44px minmax(0,1fr) 44px; }
.stepper button { border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; font-weight: 600; }
.stepper button:first-child { border-radius: 8px 0 0 8px; }
.stepper button:last-child { border-radius: 0 8px 8px 0; }
.stepper input { border-radius: 0; border-inline: 0; text-align: center; font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.form .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.form .actions .btn { flex: 1; }

.hist h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.trend { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.trend svg { flex: 1; min-width: 0; height: 52px; }
.trend .delta { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.delta.up { color: var(--ok); }
.hist ol { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.hist li { display: grid; grid-template-columns: 64px 76px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 4px 6px 10px; font-size: .9rem; }
.hist li + li { border-top: 1px solid var(--line); }
.hist .d { color: var(--muted); }
.hist .w { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.hist .rn { min-width: 0; overflow-wrap: anywhere; }
.hist .rn small { color: var(--muted); display: block; }
.hist li button { border: 0; background: none; padding: 6px 8px; font-size: .8rem; color: var(--muted); border-radius: 6px; }
.hist li button.armed { background: var(--accent); color: var(--accent-ink); }
.hist .empty { padding: 10px; color: var(--muted); font-size: .9rem; }

/* Plan / import */
.plan-box { margin-top: 28px; padding: 16px; border: 1px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; }
.plan-box h2 { font-size: 1.4rem; text-transform: uppercase; }
.plan-box p { margin: 0; color: var(--muted); font-size: .92rem; }
.welcome { margin-top: 24px; padding: 22px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; }
.welcome h2 { font-size: 2rem; text-transform: uppercase; }
.welcome ol { margin: 0; padding-left: 20px; color: var(--muted); }
.preview { display: flex; flex-direction: column; gap: 10px; }
.preview .day { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; }
.preview .day h3 { font-size: 1.15rem; text-transform: uppercase; margin-bottom: 4px; }
.preview .day ul { margin: 0; padding-left: 18px; font-size: .88rem; }
.preview .day li span { color: var(--muted); }
.banner { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: .88rem; }
.welcome.warn { border-color: var(--accent); background: var(--accent-soft); }
.welcome.warn h2 { color: var(--accent); }
.welcome.warn p, .welcome.warn ul { margin: 0; }
.welcome.warn ul { padding-left: 20px; }
.loading { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
.loading svg { width: 132px; height: auto; overflow: visible; }
.loading .bar { fill: var(--muted); }
.loading .plate { fill: var(--accent); }
.loading .shadow { fill: var(--line); transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .loading .lift { animation: lift 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  .loading .shadow { animation: shadow 1.1s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-34px); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.6); opacity: .45; } }
}

/* Bottom tab bar */
.wrap:has(.tabbar) { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; justify-content: center; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; max-width: 300px; min-height: 46px; border: 0; border-radius: var(--r); background: none; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tabbar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Progress */
.prog { margin-top: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; }
.prog h2 { font-size: 1.4rem; text-transform: uppercase; }
.prog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1; }
.big small { font-size: 1rem; color: var(--muted); }
.prog .delta { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.prog .hist li.body-row { grid-template-columns: 64px 1fr 0 auto; }
.lifts { display: flex; flex-direction: column; gap: 8px; }
.lifts .ex { background: var(--surface-2); }
.ex-head.lift { grid-template-columns: minmax(0,1fr) auto; }
.lifts .panel { background: var(--surface); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { font: 500 10px var(--font-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .val { font: 700 13px var(--font-display); fill: var(--ink); }
.tip { position: absolute; top: -6px; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 600; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }

/* Plan builder */
.field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; color: inherit; resize: vertical; }
.bday-head { display: flex; gap: 8px; align-items: center; }
.bday-title { flex: 1; min-width: 0; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
.bex { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bex-head { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.bex input { width: 100%; min-width: 0; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.bex-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.bex-grid .wide { grid-column: 1 / -1; }
.mini-row { display: flex; gap: 4px; }
.mini { min-width: 34px; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; font-weight: 600; color: var(--muted); }
.mini.armed { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mini[disabled] { opacity: .35; cursor: default; }
.add-day { width: 100%; margin-top: 12px; border-style: dashed; }
.save-bar { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 8px; margin-top: 16px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.save-bar .btn { flex: 1; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); z-index: 20; }
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: drop .16s ease-out; }
  @keyframes drop { from { opacity: .4; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading" role="status"><svg viewBox="0 0 132 84" aria-hidden="true"><ellipse class="shadow" cx="66" cy="78" rx="46" ry="4"/><g class="lift"><rect class="bar" x="4" y="39" width="124" height="6" rx="3"/><rect class="plate" x="14" y="22" width="10" height="40" rx="3"/><rect class="plate" x="26" y="28" width="7" height="28" rx="2"/><rect class="plate" x="108" y="22" width="10" height="40" rx="3"/><rect class="plate" x="99" y="28" width="7" height="28" rx="2"/></g></svg><span class="sr">Cargando</span></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
  "use strict";

  // ---------- state ----------
  const S = {
    ready: false, plan: null, logs: {}, day: 0, open: null, editing: null,
    drafts: {}, preview: null, importing: false, local: false, armed: null,
    tab: "train", body: [], bodyDraft: null, progOpen: null, builder: null,
  };
  try { S.day = parseInt(localStorage.getItem("gym.day"), 10) || 0; } catch (e) {}
  try { if (localStorage.getItem("gym.tab") === "progress") S.tab = "progress"; } catch (e) {}

  const $ = (s, r = document) => r.querySelector(s);
  const LOADER = $("#app").innerHTML; // the animated barbell already in the page
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const pad = n => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmtDate = s => { const [, m, d] = s.split("-"); return `${+d} ${MONTHS[+m - 1]}`; };
  const daysAgo = s => { const [y, m, d] = s.split("-").map(Number); const t = new Date(); return Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(y, m - 1, d)) / 864e5); };
  const relDate = s => { const n = daysAgo(s); return n <= 0 ? "hoy" : n === 1 ? "ayer" : n < 30 ? `hace ${n} días` : fmtDate(s); };
  const fmtW = w => (w == null || w === "" ? "—" : String(Math.round(w * 100) / 100).replace(".", ","));
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "ejercicio";
  const safeUrl = u => (/^https?:\/\//i.test(u || "") ? u : "");

  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- storage: Firebase account, artifact db, or this device only ----------
  // The web config is public by design; access is enforced by firestore.rules.
  const FB_CONFIG = {
    apiKey: "AIzaSyD7ntJ9Soxw9wV4bqRiAIdMzlIkoY9BYgs",
    authDomain: "libreta-gym.firebaseapp.com",
    projectId: "libreta-gym",
    storageBucket: "libreta-gym.firebasestorage.app",
    messagingSenderId: "61107771415",
    appId: "1:61107771415:web:37f06c5b067c1fe8686452",
  };
  let store = null, auth = null;
  const chains = {};
  const queue = (key, fn) => (chains[key] = (chains[key] || Promise.resolve()).then(fn, fn));
  const lsRead = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const lsWrite = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  async function initStore() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (db) {
      store = {
        savePlan: p => queue("plan", () => db.doc("app/plan").set(p)),
        saveBody: e => queue("body", () => db.doc("app/body").set({ entries: e })),
        saveLog: (id, d) => queue("log/" + id, () => db.collection("log").doc(id).set(d)),
        deleteLog: id => queue("log/" + id, () => db.collection("log").doc(id).delete()),
      };
      const fail = e => toast("No se pudo leer tus datos (" + (e && e.code || "error") + "). Recargá la página.");
      db.doc("app/plan").onSnapshot(s => { S.plan = s.exists ? s.data() : null; S.ready = true; render(); }, fail);
      db.collection("log").onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.logs = m; render(); }, fail);
      db.doc("app/body").onSnapshot(s => { S.body = (s.exists && s.data().entries) || []; render(); }, fail);
    } else if (lsRead("gym.mode") === "local") {
      initLocal();
    } else if (window.firebase) {
      initFirebase();
    } else {
      S.auth = "nolib"; S.ready = true; render();
    }
  }

  async function initLocal() {
    S.local = true; S.auth = null;
    S.plan = lsRead("gym.plan"); S.logs = lsRead("gym.logs") || {}; S.body = lsRead("gym.body") || [];
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    store = {
      replaceAll: async (p, l) => { S.plan = p; S.logs = l; lsWrite("gym.plan", p); lsWrite("gym.logs", l); render(); },
      savePlan: async p => { S.plan = p; lsWrite("gym.plan", p); render(); },
      saveBody: async e => { S.body = e; lsWrite("gym.body", e); render(); },
      saveLog: async (id, d) => { S.logs = { ...S.logs, [id]: d }; lsWrite("gym.logs", S.logs); render(); },
      deleteLog: async id => { const m = { ...S.logs }; delete m[id]; S.logs = m; lsWrite("gym.logs", m); render(); },
    };
    S.ready = true; render();
  }

  // Firestore applies writes locally at once and syncs when there is signal,
  // so the page never waits for the server; failures surface as a toast.
  const fire = p => { p.catch(e => toast(saveError(e))); return Promise.resolve(); };

  function initFirebase() {
    firebase.initializeApp(FB_CONFIG);
    auth = firebase.auth();
    const fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    auth.getRedirectResult().catch(e => toast(authError(e)));
    let unsubs = [];
    auth.onAuthStateChanged(user => {
      unsubs.forEach(u => u()); unsubs = [];
      Object.assign(S, { user, plan: null, logs: {}, body: [], bodyDraft: null, open: null, editing: null, drafts: {}, preview: null, migrate: null, builder: null });
      if (!user) { S.auth = "out"; S.ready = true; render(); return; }
      S.auth = "in"; S.ready = false; render();
      const base = fs.collection("users").doc(user.uid);
      const planRef = base.collection("data").doc("plan"), logsRef = base.collection("logs");
      store = {
        savePlan: p => fire(planRef.set(p)),
        saveBody: e => fire(base.collection("data").doc("body").set({ entries: e })),
        saveLog: (id, d) => fire(logsRef.doc(id).set(d)),
        deleteLog: id => fire(logsRef.doc(id).delete()),
        replaceAll: (p, l) => {
          const b = fs.batch(); b.set(planRef, p);
          Object.entries(l || {}).slice(0, 450).forEach(([id, d]) => b.set(logsRef.doc(id), d));
          return fire(b.commit());
        },
      };
      const fail = e => { S.loadError = (e && e.code) || "error"; S.ready = true; render(); };
      S.loadError = null;
      // Without signal on a new phone the server never answers: after a while, show what is cached.
      const slow = setTimeout(() => { if (!S.ready && S.user === user) { S.ready = true; render(); } }, 10000);
      unsubs.push(() => clearTimeout(slow));
      unsubs.push(planRef.onSnapshot({ includeMetadataChanges: true }, s => {
        S.plan = s.exists ? s.data() : null;
        if (!s.exists && s.metadata.fromCache) { if (S.ready) render(); return; } // wait for the server before showing an empty account
        offerMigration(user.uid);
        S.ready = true; render();
      }, fail));
      unsubs.push(logsRef.onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.logs = m; render(); }, fail));
      unsubs.push(base.collection("data").doc("body").onSnapshot(s => { S.body = (s.exists && s.data().entries) || []; render(); }, fail));
    });
  }

  // A new account on a phone that already has notes from before the login: offer to bring them over.
  function offerMigration(uid) {
    if (S.plan || lsRead("gym.migrated." + uid)) return;
    const plan = lsRead("gym.plan"), logs = lsRead("gym.logs") || {};
    const count = Object.keys(logs).length;
    if (plan && count) S.migrate = { plan, logs, count };
  }

  function authError(e) {
    const c = e && e.code || "";
    if (c === "auth/unauthorized-domain") return "Falta autorizar este sitio en Firebase (Authentication → Dominios autorizados).";
    if (c === "auth/operation-not-allowed") return "Falta activar el ingreso con Google en Firebase.";
    if (c === "auth/network-request-failed") return "Sin conexión. Probá de nuevo cuando tengas señal.";
    return "No se pudo entrar (" + (c || "error") + ").";
  }
  async function signIn() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    try { await auth.signInWithPopup(p); }
    catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(p).catch(er => toast(authError(er)));
      else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast(authError(e));
    }
  }

  // ---------- PDF reading ----------
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el lector de PDF. Revisá tu conexión.")); document.head.appendChild(s); });
  }
  async function pdfLib() {
    if (!window.pdfjsLib) {
      const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      await loadScript(base + "pdf.min.js");
      await loadScript(base + "pdf.worker.min.js"); // runs on the page itself; separate workers are not allowed here
    }
    return window.pdfjsLib;
  }

  const HEADERS = [[/^ejercicio/i, "name"], [/^video/i, "video"], [/^series/i, "sets"], [/^rep/i, "reps"], [/^descanso/i, "rest"], [/^observ/i, "obs"]];

  // Two kinds of plan PDF:
  // - list: "Entrenamiento N" blocks with the columns Ejercicio / Video / Series / Reps / Descanso / Observaciones.
  // - grid: one column per weekday (LUNES, MARTES…), one exercise per cell written as "Name 3x10",
  //   and "COMBINADOS" cells that start a group of exercises done together.
  async function parsePlanPdf(buf) {
    const lib = await pdfLib();
    const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
    const rows = [], pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const links = (await page.getAnnotations()).filter(a => a.subtype === "Link" && a.url).map(a => {
        const [x0, y0, x1, y1] = a.rect; return { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1), url: a.url };
      });
      const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({
        x0: i.transform[4], x1: i.transform[4] + i.width, y: i.transform[5], h: Math.abs(i.transform[3]) || 8, str: i.str.replace(/\s+/g, " ").trim(),
      })).sort((a, b) => b.y - a.y || a.x0 - b.x0);
      pages.push(items);
      const pageRows = [];
      for (const it of items) {
        let r = pageRows.find(r => Math.abs(r.y - it.y) < 4);
        if (!r) { r = { y: it.y, items: [] }; pageRows.push(r); }
        r.items.push(it);
      }
      pageRows.sort((a, b) => b.y - a.y);
      for (const r of pageRows) {
        r.items.sort((a, b) => a.x0 - b.x0);
        r.text = r.items.map(i => i.str).join(" ");
        const mid = r.y + (r.items[0].h * 0.3);
        r.links = links.filter(l => mid >= l.y0 - 1 && mid <= l.y1 + 1);
        rows.push(r);
      }
    }

    const grid = rows.some(r => r.items.filter(x => WEEKDAY.test(x.str)).length > 1);
    const plan = grid ? parseGrid(rows, pages) : parseList(rows);
    plan.days = plan.days.filter(d => d.exercises.length);
    if (!plan.days.length) throw new Error("No encontré ejercicios en ese PDF. ¿Es la planilla del gimnasio?");
    assignIds(plan);
    return plan;
  }

  // Each exercise's notes are stored under its id: the name as a slug, so a new plan with the
  // same exercise keeps its history. Exercises that already have an id keep it.
  function assignIds(plan) {
    const used = new Set();
    for (const d of plan.days) for (const e of d.exercises) if (e.id && !used.has(e.id)) used.add(e.id); else delete e.id;
    for (const d of plan.days) for (const e of d.exercises) if (!e.id) {
      let id = slug(e.name), n = 2; while (used.has(id)) id = slug(e.name) + "-" + n++;
      used.add(id); e.id = id;
    }
  }

  function parseList(rows) {
    const plan = { gym: "", coach: "", notes: [], days: [] };
    let day = null, cols = null, inNotes = false, m;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i], t = r.text;
      if ((m = t.match(/Profe(?:sor|sora)?\s*:?\s*(.+)/i)) && !plan.coach) {
        plan.coach = m[1].trim();
        const prev = rows[i - 1];
        if (prev) plan.gym = prev.items.filter(x => !/^logo$/i.test(x.str)).map(x => x.str).join(" ");
        continue;
      }
      if (/observaciones generales/i.test(t)) { inNotes = true; continue; }
      if ((m = t.match(/^(Entrenamiento|D[íi]a|Rutina)\s*(\d+)/i))) {
        inNotes = false;
        day = { title: `${m[1][0].toUpperCase()}${m[1].slice(1).toLowerCase()} ${m[2]}`, exercises: [] };
        plan.days.push(day); cols = null; continue;
      }
      if (inNotes) {
        if (/n[úu]mero de entrenamientos/i.test(t)) { inNotes = false; continue; }
        const line = t.replace(/^\s*-\s*/, "").trim();
        if (line) plan.notes.push(line);
        continue;
      }
      if (/FIN_ENTRENAMIENTO/i.test(t)) { day = null; cols = null; continue; }
      if (r.items.some(x => /^ejercicio$/i.test(x.str))) {
        if (!day) { day = { title: `Entrenamiento ${plan.days.length + 1}`, exercises: [] }; plan.days.push(day); }
        cols = r.items.map(x => { const h = HEADERS.find(([re]) => re.test(x.str)); return { key: h ? h[1] : "other", c: (x.x0 + x.x1) / 2 }; });
        continue;
      }
      if (!day || !cols) continue;
      const ex = { name: [], sets: [], reps: [], rest: [], obs: [], video: "" };
      for (const it of r.items) {
        const c = (it.x0 + it.x1) / 2;
        const link = r.links.find(l => c >= l.x0 - 2 && c <= l.x1 + 2);
        if (link) { ex.video = ex.video || link.url; continue; }
        let best = cols[0];
        for (const col of cols) if (Math.abs(col.c - c) < Math.abs(best.c - c)) best = col;
        if (best.key === "name" || it.x0 < cols[0].c) ex.name.push(it.str);
        else if (ex[best.key] && best.key !== "video") ex[best.key].push(it.str);
      }
      if (!ex.video && r.links.length) ex.video = r.links[0].url;
      const name = ex.name.join(" ").replace(/\s*\|\s*$/, "").trim();
      if (!name || /^n[ºo°]\s*de\s*ej/i.test(name)) continue;
      day.exercises.push({ name, sets: ex.sets.join(" "), reps: ex.reps.join(" "), rest: ex.rest.join(" "), obs: ex.obs.join(" "), video: safeUrl(ex.video) });
    }
    return plan;
  }

  const WEEKDAY = /^(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)\b/i;
  const COMBO = /^combinad[oa]s?$/i;

  function parseGrid(rows, pages) {
    const plan = { gym: "", coach: "", student: "", notes: [], days: [] };
    let m;
    const headPage = pages.findIndex(items => items.filter(x => WEEKDAY.test(x.str)).length > 1);
    const heads = pages[headPage].filter(x => WEEKDAY.test(x.str));
    const top = Math.max(...heads.map(h => h.y));

    // "Profe: …", "Gym: …", "Alumna: …", "Objetivo: …", "Observaciones: …" above the table.
    for (const r of rows) {
      if (!(m = r.text.match(/^(Profe(?:sor|sora)?|Gym|Gimnasio|Alumn[oa]|Socio|Socia|Objetivo|Observaciones)\s*:\s*(.*)$/i))) continue;
      const key = m[1].toLowerCase(), val = m[2].trim();
      if (!val) continue;
      if (key.startsWith("profe")) plan.coach = plan.coach || val;
      else if (key.startsWith("gym") || key.startsWith("gimnasio")) plan.gym = plan.gym || val;
      else if (key.startsWith("alumn") || key.startsWith("soci")) plan.student = plan.student || val;
      else if (key === "objetivo") plan.notes.push("Objetivo: " + val);
      else plan.notes.push(val);
    }

    // Columns start at the weekday headers; a header may wrap ("LUNES (tren" / "inferior)").
    // Within a column, a bigger vertical gap than a line break starts a new cell.
    const cols = heads.sort((a, b) => a.x0 - b.x0).map(h => h.x0);
    const colOf = it => cols.reduce((best, c, i) => (Math.abs(c - it.x0) < Math.abs(cols[best] - it.x0) ? i : best), 0);
    const cells = cols.map(() => []);
    pages.forEach((items, p) => {
      if (p < headPage) return;
      const last = cols.map(() => null);
      for (const it of items) {
        if (p === headPage && it.y > top) continue;
        if (it.x0 < cols[0] - 20) continue;
        const c = colOf(it), prev = last[c];
        if (!prev || prev.y - it.y > Math.max(prev.h, it.h) * 1.7) cells[c].push([]);
        cells[c][cells[c].length - 1].push(it);
        last[c] = it;
      }
    });

    for (const col of cells) {
      const [head, ...body] = col.map(cell => cell.map(i => i.str).join(" ").replace(/\s+/g, " ").trim()).filter(Boolean);
      if (!head) continue;
      let title = head.toLowerCase().replace(/^./, ch => ch.toUpperCase());
      if (title.includes("(") && !title.includes(")")) title += ")";
      const day = { title, exercises: [] };
      let group = 0;
      for (const text of body) {
        if (COMBO.test(text)) { group++; continue; }
        const ex = splitSetsReps(text);
        day.exercises.push({ name: ex.name, sets: ex.sets, reps: ex.reps, rest: "", obs: group ? "Combinado " + group : "", video: "" });
      }
      plan.days.push(day);
    }
    return plan;
  }

  // "Press banca plano 3x8-10" → name, sets "3", reps "8-10". Also "3x30seg", "3x8 cada lado",
  // and "312" (a missing "x") at the end.
  function splitSetsReps(text) {
    let m = text.match(/^(.*?)\s*\b(\d+)\s*[x×]\s*(\d+(?:\s*[-–a]\s*\d+)?\s*(?:seg(?:undos)?|s|min|")?)(.*)$/i);
    if (m) return { name: m[1].trim(), sets: m[2], reps: m[3].replace(/\s+/g, "") + (m[4].trim() ? " " + m[4].trim() : "") };
    if ((m = text.match(/^(.*\D)\s+([2-6])(\d{1,2})$/))) return { name: m[1].trim(), sets: m[2], reps: m[3] };
    return { name: text, sets: "", reps: "" };
  }

  // ---------- derived data ----------
  const entriesOf = id => ((S.logs[id] && S.logs[id].entries) || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const lastOf = id => { const e = entriesOf(id); return e[e.length - 1] || null; };
  const lastWeightOf = id => { const e = entriesOf(id).filter(x => x.w != null); return e.length ? e[e.length - 1].w : null; };
  function dayLast(d) { let best = ""; for (const e of d.exercises) { const l = lastOf(e.id); if (l && l.d > best) best = l.d; } return best; }
  function draftOf(ex) {
    if (!S.drafts[ex.id]) { const w = lastWeightOf(ex.id); S.drafts[ex.id] = { w: w == null ? "" : fmtW(w), r: "", n: "", d: today() }; }
    return S.drafts[ex.id];
  }

  // ---------- views ----------
  function viewWelcome() {

      <section class="welcome">
        <h2>Cargá tu plan</h2>
        <ol><li>Elegí el PDF que te pasó el profe, o armalo a mano.</li><li>Revisá que los ejercicios estén bien.</li><li>Guardalo. Queda listo para la próxima vez.</li></ol>
        ${viewImport()}
        ${S.preview ? "" : `<p class="obs">¿No tenés el PDF? Escribí vos los ejercicios de cada día, con sus series y repeticiones.</p>
        <div class="links"><button class="btn" data-act="b-new">Armar mi plan a mano</button></div>`}
      </section>${viewBackup()}${viewAccount()}`;
  }

  const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>`;
  const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>`;
  const themeBtn = () => isDark()
    ? `<button class="theme-btn" data-act="theme" aria-label="Cambiar a modo claro" title="Modo claro">${SUN}</button>`
    : `<button class="theme-btn" data-act="theme" aria-label="Cambiar a modo oscuro" title="Modo oscuro">${MOON}</button>`;
  const brandTop = sub => `<header class="top"><div class="brand"><h1>Libreta de Gym</h1><p>${sub}</p></div><div class="top-right">${themeBtn()}</div></header>`;

  const localBanner = () => "";
  const viewBackup = () => !S.local ? "" : `<section class="plan-box"><h2>Copia de seguridad</h2>

    </section>`;

  function viewImport() {
    if (S.preview) {
      const p = S.preview, total = p.days.reduce((n, d) => n + d.exercises.length, 0);
      return `<div class="preview">
        <p><b>${p.days.length} entrenamientos · ${total} ejercicios</b>${p.coach ? ` · Profe: ${esc(p.coach)}` : ""}</p>
        ${p.days.map(d => `<div class="day"><h3>${esc(d.title)}</h3><ul>${d.exercises.map(e => `<li>${esc(e.name)} <span>${esc([e.sets && e.sets + " series", e.reps].filter(Boolean).join(" · "))}</span></li>`).join("")}</ul></div>`).join("")}

      </div>`;
    }
    return `<div class="links"><label class="btn ${S.plan ? "" : "primary"}" for="pdf-in">${S.importing ? "Leyendo PDF…" : S.plan ? "Cargar un plan nuevo (PDF)" : "Elegir PDF"}</label>
      <input class="sr" type="file" id="pdf-in" accept="application/pdf,.pdf"></div>`;
  }

  // ---------- progress charts ----------
  const dayMs = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const niceStep = r => { const p = 10 ** Math.floor(Math.log10(r)); const m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; };

  // One series over real time: recessive grid, 2px line, ringed dots, last value labelled, tap/hover for each point.
  function lineChart(pts, label) {
    const W = 340, H = 180, L = 36, R = 14, T = 22, B = 24;
    const xs = pts.map(p => dayMs(p.d)), ws = pts.map(p => p.w);
    let x0 = Math.min(...xs), x1 = Math.max(...xs);
    if (x0 === x1) { x0 -= 3 * 864e5; x1 += 3 * 864e5; }
    let lo = Math.min(...ws), hi = Math.max(...ws);
    const pad = (hi - lo) * 0.15 || Math.max(1, hi * 0.04);
    lo -= pad; hi += pad;
    const step = niceStep((hi - lo) / 3);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const X = v => L + ((v - x0) / (x1 - x0)) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const xy = pts.map((p, i) => [X(xs[i]), Y(p.w)]);
    const f = n => n.toFixed(1);
    const line = xy.map((p, i) => (i ? "L" : "M") + f(p[0]) + " " + f(p[1])).join(" ");
    const area = `${line} L${f(xy[xy.length - 1][0])} ${H - B} L${f(xy[0][0])} ${H - B} Z`;
    let grid = "";
    for (let v = lo; v <= hi + step / 2; v += step) {
      grid += `<line x1="${L}" x2="${W - R}" y1="${f(Y(v))}" y2="${f(Y(v))}" stroke="var(--line)" stroke-width="1"/>
        <text x="${L - 6}" y="${f(Y(v) + 3.5)}" text-anchor="end" class="ax">${fmtW(v)}</text>`;
    }
    const ticks = [0, pts.length - 1];
    if (pts.length > 4) ticks.splice(1, 0, Math.round((pts.length - 1) / 2));
    const xl = [...new Set(ticks)].map((i, k, a) => `<text x="${f(xy[i][0])}" y="${H - 6}" text-anchor="${a.length > 1 && k === 0 ? "start" : k === a.length - 1 && a.length > 1 ? "end" : "middle"}" class="ax">${fmtDate(pts[i].d)}</text>`).join("");
    const last = xy[xy.length - 1];
    const data = xy.map((p, i) => [+f(p[0]), +f(p[1]), `${fmtDate(pts[i].d)} · ${fmtW(pts[i].w)} kg${pts[i].r ? " · " + pts[i].r + " reps" : ""}`]);
    return `<div class="chart" data-w="${W}" data-pts="${esc(JSON.stringify(data))}">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: de ${fmtW(ws[0])} a ${fmtW(ws[ws.length - 1])} kg">
        ${grid}
        <path d="${area}" fill="var(--accent-soft)" opacity=".7"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${xy.map(p => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
        <text x="${f(Math.min(last[0], W - R))}" y="${f(last[1] - 10)}" text-anchor="end" class="val">${fmtW(ws[ws.length - 1])} kg</text>
        ${xl}
        <line class="xh" x1="0" x2="0" y1="${T - 6}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        <circle class="xd" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      </svg>
      <div class="tip" hidden></div>
    </div>`;
  }

  function chartHover(e) {
    const c = e.target.closest && e.target.closest(".chart"); if (!c) return;
    const svg = c.querySelector("svg"), r = svg.getBoundingClientRect(), W = +c.dataset.w;
    const pts = JSON.parse(c.dataset.pts), x = ((e.clientX - r.left) / r.width) * W;
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p;
    const xh = c.querySelector(".xh"), xd = c.querySelector(".xd"), tip = c.querySelector(".tip");
    xh.setAttribute("x1", best[0]); xh.setAttribute("x2", best[0]); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", best[0]); xd.setAttribute("cy", best[1]); xd.setAttribute("visibility", "visible");
    tip.textContent = best[2]; tip.hidden = false;
    const left = (best[0] / W) * r.width;
    tip.style.left = Math.max(4, Math.min(r.width - tip.offsetWidth - 4, left - tip.offsetWidth / 2)) + "px";
  }
  function chartLeave(e) {
    const c = e.target.closest && e.target.closest(".chart"); if (!c) return;
    c.querySelector(".xh").setAttribute("visibility", "hidden"); c.querySelector(".xd").setAttribute("visibility", "hidden"); c.querySelector(".tip").hidden = true;
  }

  const bodySorted = () => (S.body || []).slice().sort((a, b) => a.d.localeCompare(b.d));
  const deltaChip = (a, b) => { const d = b - a; return `<span class="delta num ${d > 0 ? "up" : ""}">${d > 0 ? "+" : ""}${fmtW(d)} kg</span>`; };

  function viewBody() {
    const list = bodySorted(), last = list[list.length - 1];
    if (!S.bodyDraft) S.bodyDraft = { w: last ? fmtW(last.w) : "", d: today() };
    const dr = S.bodyDraft, same = list.some(e => e.d === dr.d);
    return `<section class="prog"><div class="prog-head"><h2>Peso corporal</h2>
        ${last ? `<span class="big num">${fmtW(last.w)}<small> kg</small></span>` : ""}</div>
      ${list.length > 1 ? `<p class="obs">${deltaChip(list[0].w, last.w)} desde el ${fmtDate(list[0].d)} · ${list.length} registros</p>${lineChart(list, "Peso corporal")}` : `<p class="obs">${list.length ? "Con un registro más aparece el gráfico." : "Anotá tu peso para empezar a ver cómo cambia."}</p>`}
      <form class="form" data-form="body">
        <div class="field"><label for="bw">Tu peso (kg)</label>
          <div class="stepper"><button type="button" data-act="bstep" data-d="-0.1" aria-label="Restar 100 g">−</button><input id="bw" data-bfield="w" class="num" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(dr.w)}"><button type="button" data-act="bstep" data-d="0.1" aria-label="Sumar 100 g">+</button></div></div>
        <div class="field"><label for="bd">Fecha</label><input id="bd" data-bfield="d" type="date" value="${esc(dr.d)}" max="${today()}"></div>
        <div class="actions"><button class="btn primary" type="submit">${same ? "Actualizar " + (dr.d === today() ? "hoy" : fmtDate(dr.d)) : "Guardar peso"}</button></div>
      </form>
      ${list.length ? `<div class="hist"><ol>${list.slice().reverse().slice(0, 6).map(e => `<li class="body-row"><span class="d num">${fmtDate(e.d)}</span><span class="w num">${fmtW(e.w)} kg</span><span></span>
        <span><button class="${S.armed === "body|" + e.d ? "armed" : ""}" data-act="del-body" data-d="${e.d}">${S.armed === "body|" + e.d ? "¿Borrar?" : "Borrar"}</button></span></li>`).join("")}</ol></div>` : ""}
    </section>`;
  }

  function viewLifts() {
    const rows = [];
    for (const d of S.plan.days) for (const ex of d.exercises) {
      const pts = entriesOf(ex.id).filter(e => e.w != null);
      if (pts.length) rows.push({ ex, pts, day: d.title.replace(/^Entrenamiento\s*/i, "Día ") });
    }
    if (!rows.length) return `<section class="prog"><h2>Tus levantamientos</h2><p class="obs">Cuando anotes pesos en tus ejercicios, acá vas a ver cómo van subiendo.</p></section>`;
    return `<section class="prog"><h2>Tus levantamientos</h2><p class="obs">Tocá un ejercicio para ver su gráfico.</p>
      <div class="lifts">${rows.map(({ ex, pts, day }) => {
        const open = S.progOpen === ex.id, a = pts[0], b = pts[pts.length - 1];
        return `<article class="ex ${open ? "open" : ""}">
          <button class="ex-head lift" data-act="prog-toggle" data-id="${ex.id}" aria-expanded="${open}">
            <span><span class="ex-name">${esc(ex.name)}</span><span class="ex-meta"><span>${esc(day)}</span><span>${pts.length} ${pts.length === 1 ? "registro" : "registros"}</span>${pts.length > 1 ? deltaChip(a.w, b.w) : ""}</span></span>
            <span class="ex-last num"><b>${fmtW(b.w)}</b><span>kg</span></span>
          </button>
          ${open ? `<div class="panel">${pts.length > 1 ? lineChart(pts, ex.name) : `<p class="obs">Con un registro más aparece el gráfico.</p>`}
            ${pts.length > 1 ? `<p class="obs">Máximo: <b>${fmtW(Math.max(...pts.map(p => p.w)))} kg</b> · Primer registro: ${fmtW(a.w)} kg el ${fmtDate(a.d)}</p>` : ""}</div>` : ""}
        </article>`; }).join("")}</div></section>`;
  }

  function viewTrend(entries) {
    const pts = entries.filter(e => e.w != null);
    if (pts.length < 2) return "";
    const ws = pts.map(e => e.w), lo = Math.min(...ws), hi = Math.max(...ws), span = hi - lo || 1;
    const W = 200, H = 44, P = 4;
    const xy = pts.map((e, i) => [P + (i * (W - 2 * P)) / (pts.length - 1), P + (H - 2 * P) * (1 - (e.w - lo) / span)]);
    const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + ` L${xy[xy.length - 1][0].toFixed(1)} ${H} L${xy[0][0].toFixed(1)} ${H} Z`;
    const end = xy[xy.length - 1], diff = ws[ws.length - 1] - ws[0];
    return `<div class="trend">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Evolución del peso">
        <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        <path d="M${end[0].toFixed(1)} ${end[1].toFixed(1)} h0" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="delta num ${diff > 0 ? "up" : ""}">${diff > 0 ? "+" : ""}${fmtW(diff)} kg<br><small style="font-weight:500;color:var(--muted)">desde ${fmtDate(pts[0].d)}</small></span>
    </div>`;
  }

  function viewPanel(ex) {
    const id = ex.id, entries = entriesOf(id);
    if (S.editing === id) {
      return `<div class="panel"><form class="form" data-form="edit" data-id="${id}">
        <div class="field full"><label for="en-${id}">Nombre</label><input id="en-${id}" name="name" value="${esc(ex.name)}" required></div>
        <div class="field"><label for="es-${id}">Series</label><input id="es-${id}" name="sets" value="${esc(ex.sets)}" inputmode="numeric"></div>
        <div class="field"><label for="er-${id}">Reps</label><input id="er-${id}" name="reps" value="${esc(ex.reps)}"></div>
        <div class="field"><label for="ed-${id}">Descanso</label><input id="ed-${id}" name="rest" value="${esc(ex.rest)}"></div>
        <div class="field"><label for="ev-${id}">Video (link)</label><input id="ev-${id}" name="video" value="${esc(ex.video)}" inputmode="url"></div>
        <div class="field full"><label for="eo-${id}">Observaciones</label><input id="eo-${id}" name="obs" value="${esc(ex.obs)}"></div>
        <div class="actions"><button class="btn primary" type="submit">Guardar cambios</button><button class="btn ghost" type="button" data-act="edit" data-id="${id}">Cancelar</button></div>
      </form></div>`;
    }
    const dr = draftOf(ex);
    const sameDay = entries.some(e => e.d === dr.d);
    return `<div class="panel">
      <div class="links">
        ${ex.video ? `<a class="btn" href="${esc(ex.video)}" target="_blank" rel="noopener">▶ Ver video</a>` : ""}
        <button class="btn ghost" data-act="edit" data-id="${id}">Editar ejercicio</button>
      </div>
      ${ex.obs || ex.rest ? `<p class="obs">${esc([ex.rest && "Descanso: " + ex.rest, ex.obs].filter(Boolean).join(" · "))}</p>` : ""}
      <form class="form" data-form="log" data-id="${id}">
        <div class="field full"><label for="w-${id}">Peso (kg)</label>
          <div class="stepper"><button type="button" data-act="step" data-id="${id}" data-d="-2.5" aria-label="Restar 2,5 kg">−</button><input id="w-${id}" data-field="w" data-id="${id}" class="num" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(dr.w)}"><button type="button" data-act="step" data-id="${id}" data-d="2.5" aria-label="Sumar 2,5 kg">+</button></div>
        </div>
        <div class="field"><label for="r-${id}">Reps hechas</label><input id="r-${id}" data-field="r" data-id="${id}" autocomplete="off" placeholder="${esc(ex.reps || "ej. 10")}" value="${esc(dr.r)}"></div>
        <div class="field"><label for="d-${id}">Fecha</label><input id="d-${id}" data-field="d" data-id="${id}" type="date" value="${esc(dr.d)}" max="${today()}"></div>
        <div class="field full"><label for="n-${id}">Nota</label><input id="n-${id}" data-field="n" data-id="${id}" autocomplete="off" placeholder="Ej: última serie al fallo" value="${esc(dr.n)}"></div>
        <div class="actions"><button class="btn primary" type="submit">${sameDay ? "Actualizar " + (dr.d === today() ? "hoy" : fmtDate(dr.d)) : "Guardar"}</button></div>
      </form>
      <div class="hist"><h3>Historial</h3>${viewTrend(entries)}
        <ol>${entries.length ? entries.slice().reverse().map(e => `<li>
          <span class="d num">${fmtDate(e.d)}</span>
          <span class="w num">${e.w != null ? fmtW(e.w) + " kg" : "—"}</span>
          <span class="rn">${esc(e.r ? e.r + " reps" : "")}${e.n ? `<small>${esc(e.n)}</small>` : ""}</span>
          <span><button data-act="load-entry" data-id="${id}" data-d="${e.d}">Editar</button><button class="${S.armed === id + "|" + e.d ? "armed" : ""}" data-act="del-entry" data-id="${id}" data-d="${e.d}">${S.armed === id + "|" + e.d ? "¿Borrar?" : "Borrar"}</button></span>
        </li>`).join("") : `<li class="empty">Todavía no anotaste este ejercicio.</li>`}</ol>
      </div>
    </div>`;
  }

  function viewExercise(ex, i) {
    const last = lastOf(ex.id), lw = lastWeightOf(ex.id), done = last && last.d === today();
    const open = S.open === ex.id;
    return `<article class="ex ${open ? "open" : ""} ${done ? "done" : ""}">
      <button class="ex-head" data-act="toggle" data-id="${ex.id}" aria-expanded="${open}">
        <span class="ex-idx num">${done ? "✓" : i + 1}</span>
        <span><span class="ex-name">${esc(ex.name)}</span>
          <span class="ex-meta">${ex.sets || ex.reps ? `<span class="chip sr-chip num">${ex.reps ? `${esc(ex.sets || "?")} × ${esc(ex.reps)}` : `${esc(ex.sets)} series`}</span>` : ""}${done ? `<span class="chip ok">Hecho hoy</span>` : ""}</span></span>
        ${lw != null ? `<span class="ex-last num"><b>${fmtW(lw)}</b><span>kg</span><small>${relDate(last.d)}</small></span>` : `<span class="ex-last none">${last ? relDate(last.d) : "sin anotar"}</span>`}
      </button>
      ${open ? viewPanel(ex) : ""}
    </article>`;
  }

  // "LUNES (tren inferior)" → "Lunes" on the day button, "tren inferior" under it.
  const dayShort = t => t.replace(/^Entrenamiento\s*/i, "Día ").replace(/\s*\(.*$/, "") || t;
  const dayFocus = t => { const m = t.match(/\(([^)]*)\)?/); return m ? m[1].trim() : ""; };

  // ---------- plan builder: write the plan by hand, or fix one read from a PDF ----------
  const blankEx = () => ({ name: "", sets: "", reps: "", rest: "", obs: "", video: "" });
  function startBuilder(src, mode) {
    const p = src ? clone(src) : { gym: "", coach: "", notes: [], days: [{ title: "Día 1", exercises: [blankEx()] }] };
    S.builder = { ...p, notesText: (p.notes || []).join("\n"), mode };
    S.armed = null; render(); window.scrollTo(0, 0);
  }

  function viewBuilder() {
    const b = S.builder, names = new Set();
    if (S.plan) for (const d of S.plan.days) for (const e of d.exercises) names.add(e.name);
    const mv = (act, di, ei, to, dis, label, txt) => `<button type="button" class="mini" data-act="${act}" data-d="${di}"${ei == null ? "" : ` data-e="${ei}"`} data-to="${to}" ${dis ? "disabled" : ""} aria-label="${label}">${txt}</button>`;
    return `${brandTop({ new: "Armá tu plan", edit: "Editá tu plan", pdf: "Revisá el plan del PDF" }[b.mode])}
      <datalist id="b-names">${[...names].map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      <section class="prog">
        <div class="form">
          <div class="field"><label for="b-gym">Gimnasio</label><input id="b-gym" data-bk="gym" value="${esc(b.gym)}" placeholder="Ej: Roma"></div>
          <div class="field"><label for="b-coach">Profe</label><input id="b-coach" data-bk="coach" value="${esc(b.coach)}" placeholder="Opcional"></div>
          <div class="field full"><label for="b-notes">Indicaciones (una por línea)</label><textarea id="b-notes" data-bk="notesText" rows="3" placeholder="Ej: Descansar 2 min entre series">${esc(b.notesText)}</textarea></div>
        </div>
      </section>
      ${b.days.map((d, di) => `<section class="prog">
        <div class="bday-head">
          <input class="bday-title" id="b-d${di}" data-bd="${di}" data-bf="title" value="${esc(d.title)}" aria-label="Nombre del día" placeholder="Ej: Lunes (tren inferior)">
          <div class="mini-row">
            ${mv("b-move-day", di, null, di - 1, di === 0, "Subir día", "↑")}${mv("b-move-day", di, null, di + 1, di === b.days.length - 1, "Bajar día", "↓")}
            ${b.days.length > 1 ? `<button type="button" class="mini ${S.armed === "bday|" + di ? "armed" : ""}" data-act="b-del-day" data-d="${di}">${S.armed === "bday|" + di ? "¿Quitar?" : "Quitar"}</button>` : ""}
          </div>
        </div>
        ${d.exercises.map((e, ei) => { const k = `b-${di}-${ei}`; return `<div class="bex">
          <div class="bex-head">
            <span class="ex-idx num">${ei + 1}</span>
            <input id="${k}-name" data-bd="${di}" data-be="${ei}" data-bf="name" value="${esc(e.name)}" list="b-names" placeholder="Ejercicio" aria-label="Ejercicio">
            <div class="mini-row">
              ${mv("b-move-ex", di, ei, ei - 1, ei === 0, "Subir", "↑")}${mv("b-move-ex", di, ei, ei + 1, ei === d.exercises.length - 1, "Bajar", "↓")}
              <button type="button" class="mini" data-act="b-del-ex" data-d="${di}" data-e="${ei}" aria-label="Quitar ejercicio">✕</button>
            </div>
          </div>
          <div class="bex-grid">
            <input id="${k}-sets" data-bd="${di}" data-be="${ei}" data-bf="sets" value="${esc(e.sets)}" inputmode="numeric" placeholder="Series" aria-label="Series">
            <input id="${k}-reps" data-bd="${di}" data-be="${ei}" data-bf="reps" value="${esc(e.reps)}" placeholder="Reps" aria-label="Repeticiones">
            <input id="${k}-rest" data-bd="${di}" data-be="${ei}" data-bf="rest" value="${esc(e.rest)}" placeholder="Descanso" aria-label="Descanso">
            <input id="${k}-obs" class="wide" data-bd="${di}" data-be="${ei}" data-bf="obs" value="${esc(e.obs)}" placeholder="Observaciones" aria-label="Observaciones">
            <input id="${k}-video" class="wide" data-bd="${di}" data-be="${ei}" data-bf="video" value="${esc(e.video)}" inputmode="url" placeholder="Link del video (opcional)" aria-label="Link del video">
          </div>
        </div>`; }).join("")}
        <button type="button" class="btn ghost" data-act="b-add-ex" data-d="${di}">+ Agregar ejercicio</button>
      </section>`).join("")}
      <button type="button" class="btn ghost add-day" data-act="b-add-day">+ Agregar día</button>
      ${S.plan && b.mode !== "edit" ? `<p class="obs" style="margin-top:12px">Se reemplaza el plan actual. Tus pesos anotados se conservan en los ejercicios que tengan el mismo nombre.</p>` : ""}
      <div class="save-bar"><button type="button" class="btn ghost" data-act="b-cancel">Cancelar</button><button type="button" class="btn primary" data-act="b-save">Guardar plan</button></div>`;
  }

  function builderAction(act, b) {
    const B = S.builder, di = +b.dataset.d, ei = +b.dataset.e, to = +b.dataset.to;
    const swap = (a, i, j) => { if (j >= 0 && j < a.length) [a[i], a[j]] = [a[j], a[i]]; };
    if (act === "b-add-day") { B.days.push({ title: "Día " + (B.days.length + 1), exercises: [blankEx()] }); render(); const t = document.getElementById("b-d" + (B.days.length - 1)); if (t) t.select(); return; }
    if (act === "b-add-ex") { B.days[di].exercises.push(blankEx()); render(); const t = document.getElementById(`b-${di}-${B.days[di].exercises.length - 1}-name`); if (t) t.focus(); return; }
    if (act === "b-del-ex") B.days[di].exercises.splice(ei, 1);
    else if (act === "b-move-ex") swap(B.days[di].exercises, ei, to);
    else if (act === "b-move-day") swap(B.days, di, to);
    else if (act === "b-del-day") {
      const key = "bday|" + di;
      if (S.armed !== key) { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3000); return; }
      S.armed = null; B.days.splice(di, 1);
    }
    render();
  }

  async function saveBuilder() {
    const B = S.builder;
    const days = B.days.map((d, i) => ({
      title: d.title.trim() || "Día " + (i + 1),
      exercises: d.exercises.filter(e => e.name.trim()).map(e => ({
        ...e, name: e.name.trim(), sets: e.sets.trim(), reps: e.reps.trim(), rest: e.rest.trim(), obs: e.obs.trim(), video: safeUrl(e.video.trim()),
      })),
    })).filter(d => d.exercises.length);
    if (!days.length) { toast("Agregá al menos un ejercicio."); return; }
    const { notesText, mode, ...rest } = B;
    const p = { ...rest, gym: (B.gym || "").trim(), coach: (B.coach || "").trim(), days,
      notes: notesText.split("\n").map(x => x.replace(/^\s*-\s*/, "").trim()).filter(Boolean) };
    if (mode !== "edit" || !p.loadedAt) p.loadedAt = today();
    assignIds(p);
    try {
      await store.savePlan(p);
      S.builder = null; S.preview = null; S.open = null; S.editing = null;
      if (mode !== "edit") S.day = 0;
      toast("Plan guardado"); render(); window.scrollTo(0, 0);
    } catch (e) { toast(saveError(e)); }
  }

  function view() {
    if (!S.ready) return LOADER;
    if (S.auth === "nolib") return viewNoLib();
    if (S.auth === "in" && S.loadError) return viewLoadError();
    if (S.auth === "out") return viewLogin();
    if (S.migrate) return viewMigrate();
    if (S.builder) return viewBuilder();
    if (!S.plan || !S.plan.days || !S.plan.days.length) return viewWelcome();
    const p = S.plan, di = Math.min(S.day, p.days.length - 1), day = p.days[di];
    const d = new Date();
    return `<header class="top">
        <div class="brand"><h1>${esc(p.gym || "Mi gimnasio")}</h1>${p.coach ? `<p>Profe: ${esc(p.coach)}</p>` : ""}</div>
        <div class="top-right">${themeBtn()}<div class="today num">${["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</div></div>
      </header>
      ${S.local ? localBanner() : ""}
      <nav class="tabbar" aria-label="Secciones">
        <button data-act="tab" data-tab="train" aria-pressed="${S.tab === "train"}">Entrenar</button>
        <button data-act="tab" data-tab="progress" aria-pressed="${S.tab === "progress"}">Progreso</button>
      </nav>
      ${S.tab === "progress" ? `${viewBody()}${viewLifts()}${viewAccount()}` : `
      <nav class="days" aria-label="Entrenamientos">${p.days.map((dd, i) => { const l = dayLast(dd); return `<button data-act="day" data-i="${i}" aria-pressed="${i === di}" title="${esc(dd.title)}"><b>${esc(dayShort(dd.title))}</b><small>${l ? relDate(l) : dayFocus(dd.title) || dd.exercises.length + " ejercicios"}</small></button>`; }).join("")}</nav>
      ${p.notes && p.notes.length ? `<details class="notes"><summary>Indicaciones</summary><ul>${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>` : ""}
      <section class="list" aria-label="${esc(day.title)}">${day.exercises.map(viewExercise).join("")}</section>
      <section class="plan-box"><h2>Tu plan</h2>
        <p>${p.days.length} entrenamientos · ${p.days.reduce((n, x) => n + x.exercises.length, 0)} ejercicios${p.loadedAt ? ` · cargado el ${fmtDate(p.loadedAt)}` : ""}. Cuando el profe te dé uno nuevo, cargalo acá.</p>
        ${S.preview ? "" : `<div class="links"><button class="btn" data-act="b-edit">Editar mi plan</button></div>`}
        ${viewImport()}
      </section>
      ${viewBackup()}${viewAccount()}`}`;
  }

  function render() {
    const a = document.activeElement, aid = a && a.id;
    let sel = null; try { sel = aid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null; } catch (e) {}
    $("#app").innerHTML = view();
    if (aid) { const el = document.getElementById(aid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  }

  // ---------- actions ----------
  const findEx = id => { for (const d of S.plan.days) for (const e of d.exercises) if (e.id === id) return e; return null; };
  const parseW = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? Math.round(v * 100) / 100 : null; };

  async function saveEntry(id) {
    const ex = findEx(id), dr = draftOf(ex), w = parseW(dr.w);
    if (w == null && !dr.r.trim()) { toast("Anotá el peso o las reps."); return; }
    const d = dr.d || today();
    const entries = entriesOf(id).filter(e => e.d !== d);
    entries.push({ d, w, r: dr.r.trim(), n: dr.n.trim() });
    entries.sort((a, b) => a.d.localeCompare(b.d));
    try {
      await store.saveLog(id, { name: ex.name, entries });
      S.drafts[id] = { w: w == null ? "" : fmtW(w), r: "", n: "", d: today() };
      toast(`Guardado: ${ex.name.slice(0, 28)}${w != null ? " · " + fmtW(w) + " kg" : ""}`);
      render();
    } catch (e) { toast(saveError(e)); }
  }
  const saveError = e => (e && e.code === "quota_exceeded" ? "No hay más espacio para guardar." : "No se pudo guardar. Probá de nuevo.");

  async function deleteEntry(id, d) {
    const key = id + "|" + d;
    if (S.armed !== key) { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3000); return; }
    S.armed = null;
    const entries = entriesOf(id).filter(e => e.d !== d);
    try {
      if (entries.length) await store.saveLog(id, { name: findEx(id).name, entries }); else await store.deleteLog(id);
      toast("Registro borrado");
    } catch (e) { toast(saveError(e)); }
  }

  async function onFile(file) {
    if (!file) return;
    S.importing = true; render();
    try { S.preview = await parsePlanPdf(await file.arrayBuffer()); }
    catch (e) { toast(e && e.message ? e.message : "No pude leer ese PDF."); }
    S.importing = false; render();
  }

  async function savePlan() {
    const p = S.preview; if (!p) return;
    p.loadedAt = today();
    try { await store.savePlan(p); S.preview = null; S.day = 0; S.open = null; toast("Plan guardado"); render(); window.scrollTo(0, 0); }
    catch (e) { toast(saveError(e)); }
  }

  async function saveEdit(form) {
    const id = form.dataset.id, f = new FormData(form), p = clone(S.plan);
    for (const d of p.days) for (const e of d.exercises) if (e.id === id) {
      e.name = (f.get("name") || "").trim() || e.name;
      e.sets = (f.get("sets") || "").trim(); e.reps = (f.get("reps") || "").trim();
      e.rest = (f.get("rest") || "").trim(); e.obs = (f.get("obs") || "").trim();
      e.video = safeUrl((f.get("video") || "").trim());
    }
    try { await store.savePlan(p); S.editing = null; toast("Ejercicio actualizado"); render(); } catch (e) { toast(saveError(e)); }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act.startsWith("b-")) {
      if (act === "b-new") startBuilder(null, "new");
      else if (act === "b-edit") startBuilder(S.plan, "edit");
      else if (act === "b-preview") startBuilder(S.preview, "pdf");
      else if (act === "b-cancel") { S.builder = null; render(); window.scrollTo(0, 0); }
      else if (act === "b-save") saveBuilder();
      else builderAction(act, b);
      return;
    }
    if (act === "toggle") { S.open = S.open === id ? null : id; S.editing = null; render(); }
    else if (act === "theme") { const t = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("gym.theme", t); } catch (er) {} render(); }
    else if (act === "tab") { S.tab = b.dataset.tab; try { localStorage.setItem("gym.tab", S.tab); } catch (er) {} render(); window.scrollTo({ top: 0 }); }
    else if (act === "prog-toggle") { S.progOpen = S.progOpen === id ? null : id; render(); }
    else if (act === "bstep") { const dr = S.bodyDraft; const v = (parseW(dr.w) || 0) + parseFloat(b.dataset.d); dr.w = fmtW(Math.max(0, Math.round(v * 10) / 10)); render(); }
    else if (act === "del-body") deleteBody(b.dataset.d);
    else if (act === "day") { S.day = +b.dataset.i; S.open = null; S.editing = null; try { localStorage.setItem("gym.day", S.day); } catch (er) {} render(); window.scrollTo({ top: 0 }); }
    else if (act === "step") { const dr = draftOf(findEx(id)); const v = (parseW(dr.w) || 0) + parseFloat(b.dataset.d); dr.w = fmtW(Math.max(0, v)); render(); }
    else if (act === "edit") { S.editing = S.editing === id ? null : id; render(); }
    else if (act === "load-entry") { const en = entriesOf(id).find(x => x.d === b.dataset.d); if (en) { S.drafts[id] = { w: en.w == null ? "" : fmtW(en.w), r: en.r || "", n: en.n || "", d: en.d }; render(); const w = document.getElementById("w-" + id); if (w) w.focus(); } }
    else if (act === "del-entry") deleteEntry(id, b.dataset.d);
    else if (act === "save-plan") savePlan();
    else if (act === "cancel-import") { S.preview = null; render(); }
    else if (act === "export") exportBackup();
    else if (act === "restore") { const r = S.restore; S.restore = null; store.replaceAll(r.plan, r.logs || {}).then(() => (Array.isArray(r.body) ? store.saveBody(r.body) : null)).then(() => toast("Copia restaurada")); }
    else if (act === "cancel-restore") { S.restore = null; render(); }
    else if (act === "sign-in") signIn();
    else if (act === "sign-out") auth.signOut();
    else if (act === "go-local") { if (S.auth === "out") { S.confirmLocal = true; render(); window.scrollTo(0, 0); } else { lsWrite("gym.mode", "local"); location.reload(); } }
    else if (act === "go-local-ok") { lsWrite("gym.mode", "local"); location.reload(); }
    else if (act === "go-account") { lsWrite("gym.mode", null); location.reload(); }
    else if (act === "reload") location.reload();
    else if (act === "migrate-yes") { const m = S.migrate; S.migrate = null; lsWrite("gym.migrated." + S.user.uid, true); store.replaceAll(m.plan, m.logs); toast("Datos subidos a tu cuenta"); render(); }
    else if (act === "migrate-no") { S.migrate = null; lsWrite("gym.migrated." + S.user.uid, true); render(); }  });
  document.addEventListener("pointermove", chartHover);
  document.addEventListener("pointerdown", chartHover);
  document.addEventListener("pointerout", e => { if (!e.relatedTarget || !e.target.closest(".chart") || !e.relatedTarget.closest || e.relatedTarget.closest(".chart") !== e.target.closest(".chart")) chartLeave(e); });

  async function saveBody() {
    const dr = S.bodyDraft, w = parseW(dr.w);
    if (w == null || w <= 0) { toast("Anotá tu peso en kg."); return; }
    const d = dr.d || today();
    const list = bodySorted().filter(e => e.d !== d);
    list.push({ d, w }); list.sort((a, b) => a.d.localeCompare(b.d));
    try { await store.saveBody(list); S.bodyDraft = { w: fmtW(w), d: today() }; toast(`Peso guardado: ${fmtW(w)} kg`); render(); }
    catch (e) { toast(saveError(e)); }
  }
  async function deleteBody(d) {
    const key = "body|" + d;
    if (S.armed !== key) { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3000); return; }
    S.armed = null;
    try { await store.saveBody(bodySorted().filter(e => e.d !== d)); toast("Registro borrado"); } catch (e) { toast(saveError(e)); }
  }

  document.addEventListener("input", e => {
    const t = e.target;
    if (S.builder && t.dataset && (t.dataset.bk || t.dataset.bf)) {
      if (t.dataset.bk) S.builder[t.dataset.bk] = t.value;
      else { const d = S.builder.days[+t.dataset.bd]; (t.dataset.be != null ? d.exercises[+t.dataset.be] : d)[t.dataset.bf] = t.value; }
      return;
    }
    if (t.dataset && t.dataset.bfield) { S.bodyDraft[t.dataset.bfield] = t.value; if (t.dataset.bfield === "d") render(); return; }
    if (!t.dataset || !t.dataset.field) return;
    const ex = findEx(t.dataset.id); if (!ex) return;
    draftOf(ex)[t.dataset.field] = t.value;
    if (t.dataset.field === "d") render();
  });
  document.addEventListener("change", e => {
    if (e.target.id === "pdf-in") onFile(e.target.files[0]);
    else if (e.target.id === "backup-in") readBackup(e.target.files[0]);
  });

  function exportBackup() {
    const data = JSON.stringify({ app: "libreta-gym", exportedAt: today(), plan: S.plan, logs: S.logs, body: S.body }, null, 1);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = `libreta-gym-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("Copia guardada en Descargas");
  }
  async function readBackup(file) {
    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!d || d.app !== "libreta-gym" || !d.plan || !Array.isArray(d.plan.days)) throw new Error();
      S.restore = d; render();
    } catch (e) { toast("Ese archivo no es una copia de la Libreta de Gym."); }
  }

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === "log") saveEntry(f.dataset.id);
    else if (f.dataset.form === "body") saveBody();
    else if (f.dataset.form === "edit") saveEdit(f);
  });

  // Keep the screen on while the app is open at the gym (if the device allows it).
  let lock = null;
  const keepAwake = () => { if (lock || !navigator.wakeLock) return; navigator.wakeLock.request("screen").then(l => { lock = l; l.addEventListener("release", () => { lock = null; }); }).catch(() => {}); };
  document.addEventListener("pointerdown", keepAwake);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

  window.__gym = { parsePlanPdf };
  initStore();
})();
</script>
</body>
</html>
